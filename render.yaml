services:
  - type: web
    name: fabricflow-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OPENAI_API_KEY
        sync: false
      - key: FABRICFLOW_LLM_MODEL
        value: gpt-4o-mini

  - type: web
    name: fabricflow-ui
    runtime: python
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: FABRICFLOW_API_URL
        fromService:
          type: web
          name: fabricflow-api
          property: hostport